name: staging sync

# Releases flow feat/fix -> staging -> main. After a staging -> main promotion (a merge
# commit), this fast-forward keeps `staging` on main's commit. Fast-forward only: a
# diverged `staging` fails here instead of being overwritten.
# A ruleset limits pushes to `staging` to the `merqo-staging-sync` GitHub App, so the
# push uses that app's token rather than GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-sync
  cancel-in-progress: false

jobs:
  sync:
    name: fast-forward staging to main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.STAGING_SYNC_APP_ID }}
          private-key: ${{ secrets.STAGING_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/staging
